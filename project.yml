name: GymLog
options:
  bundleIdPrefix: com.surproductions
  preGenCommand: sh make-icon.sh
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "8"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FUR4UGH9HT
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GymLog:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "Widget*.swift"
          - "Watch/**"
      - path: Watch/WatchShared.swift
      - Assets.xcassets
    dependencies:
      - target: GymLogWidget
    info:
      path: AppInfo.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.surproductions.gymlog.friends
    entitlements:
      path: GymLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.surproductions.gymlog
        aps-environment: development
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.gymlog
        PRODUCT_NAME: GymLog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gym Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Gym Log uses the camera to photograph meals so Claude can estimate their calories and nutrition.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Gym Log lets you pick a meal photo so Claude can estimate its calories and nutrition.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Light AppIcon-Mono AppIcon-Crimson AppIcon-Forest AppIcon-Midnight AppIcon-Neon AppIcon-Sunset AppIcon-Ocean AppIcon-Cockpit AppIcon-Gold AppIcon-Camo AppIcon-Vapor AppIcon-Acid AppIcon-Beast"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Gym Log adds your upcoming gym days to your calendar and keeps them updated.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Gym Log reads heart rate and calories from your Apple Watch workouts.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Gym Log saves your Apple Watch strength workouts to Apple Health.
  GymLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes:
          - "Widget*.swift"
          - "SharedSnapshot.swift"
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Gym Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GymLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.surproductions.gymlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.gymlog.widget
        PRODUCT_NAME: GymLogWidget
        SKIP_INSTALL: YES
  GymLogWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
    info:
      path: WatchInfo.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: GymLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.gymlog.watchkitapp
        PRODUCT_NAME: GymLogWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gym Log
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.surproductions.gymlog
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: Gym Log reads your heart rate and calories during workouts.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Gym Log saves your strength workouts to Apple Health.
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
