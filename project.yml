name: GymLog
options:
  bundleIdPrefix: com.surproductions
  preGenCommand: sh make-icon.sh
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FUR4UGH9HT
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GymLog:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "Widget*.swift"
      - Assets.xcassets
    dependencies:
      - target: GymLogWidget
    entitlements:
      path: GymLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.surproductions.gymlog
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.gymlog
        PRODUCT_NAME: GymLog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gym Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Gym Log uses the camera to photograph meals so Claude can estimate their calories and nutrition.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Gym Log lets you pick a meal photo so Claude can estimate its calories and nutrition.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GymLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes:
          - "Widget*.swift"
          - "SharedSnapshot.swift"
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Gym Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GymLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.surproductions.gymlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.gymlog.widget
        PRODUCT_NAME: GymLogWidget
        SKIP_INSTALL: YES
