name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project GymLog.xcodeproj -scheme GymLog -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign with entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/GymLog.app
          codesign -f -s - --entitlements GymLogWidget.entitlements "$APP/PlugIns/GymLogWidget.appex"
          codesign -f -s - --entitlements GymLog.entitlements "$APP"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GymLog.app Payload/
          zip -qry GymLog.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GymLog-ipa
          path: GymLog.ipa
