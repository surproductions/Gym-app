name: Generate Xcode project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XcodeGen
        run: |
          git clone --depth 1 https://github.com/yonaskolb/XcodeGen.git /tmp/xcodegen
          cd /tmp/xcodegen && swift build -c release --product xcodegen
      - name: Generate project
        run: /tmp/xcodegen/.build/release/xcodegen generate --spec project.yml
      - name: Publish generated files to the "generated" branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B generated
          git add -f GymLog.xcodeproj Assets.xcassets Watch/Assets.xcassets *.entitlements WidgetInfo.plist WatchInfo.plist AppInfo.plist
          git commit -m "Generated Xcode project for ${GITHUB_SHA}"
          git push -f origin generated
